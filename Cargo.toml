[package]
name = "ratatata"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A tiny terminal text editor built with ratatui."
keywords = ["editor", "terminal", "tui", "ratatui", "text-editor"]
categories = ["command-line-utilities", "text-editors"]
repository = "https://github.com/gitwyrm/ratatata"
readme = "README.md"
exclude = ["resources/"]

[[bin]]
name = "rat"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
crossterm = "0.29.0"
image = "0.25.10"
ratatui = "0.30.2"
ratatui-themes = "0.3.0"
# chafa (the default) needs a system libchafa, so only the pure-Rust
# protocols are enabled; unicode half-blocks remain the universal fallback.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false }
objc2-app-kit = {
    version = "0.3.2",
    default-features = false,
    features = ["NSScreen", "objc2-core-foundation"],
}
